[package]
name = "infra_hpp_patcher"

# MAJOR.MINOR by hand, BUILD.REVISION from the build time: see build.rs
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[bin]]
name = "infra-hpp-patcher"
path = "src/main.rs"

[dependencies]
image-webp = "0.2"
memchr     = "2"

# The button icons: paths only, no text or embedded images
resvg = { version = "0.50", default-features = false }

# IShellLinkW and IPersistFile for the desktop shortcut: windows-sys has no COM interfaces
[dependencies.windows]
version = "0.62"
features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
]

[build-dependencies]
embed-resource = "3"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
