[package]
name = "infra_hpp_patcher"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[bin]]
name = "infra-hpp-patcher"
path = "src/main.rs"

[dependencies]
image-webp = "0.2"

[build-dependencies]
embed-resource = "3"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
